name: Release

# Publishes to PyPI via OIDC trusted publishing, then cuts a GitHub Release.
# The build, publish, and release steps live in ljmerza/misc-actions; this file
# only wires them to this package.
#
#   test -> release (publish-pypi -> github-release)
#
# A tag whose PyPI publish failed is not "released".

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    uses: ljmerza/misc-actions/.github/workflows/python-tests.yml@v2
    with:
      python-version: "3.12"
      coverage-source: nodered_mcp
    secrets: inherit

  release:
    name: Publish
    needs: test
    permissions:
      contents: write
      id-token: write
    uses: ljmerza/misc-actions/.github/workflows/python-release.yml@v2.2.0
    with:
      package-name: nodered-mcp
      python-version: "3.12"
    secrets: inherit
