name: Release

# Publishes to PyPI via OIDC trusted publishing.
#
#   test -> publish-pypi
#
# The publish job cannot move into a reusable workflow. PyPI matches the OIDC
# `job_workflow_ref` claim, which for a reusable workflow names that workflow's
# own repository rather than this one, and PyPI does not support that yet:
# https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
# The build steps are still shared through the python-build composite action,
# because an action runs inside this job and leaves the claim pointing here.
#
# The GitHub Release is cut separately, not by this workflow.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    uses: ljmerza/misc-actions/.github/workflows/python-tests.yml@v2
    with:
      python-version: "3.12"
      coverage-source: nodered_mcp
    secrets: inherit

  publish-pypi:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nodered-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ljmerza/misc-actions/actions/python-build@v2.2.0
        with:
          python-version: "3.12"
          # Only a tag can be checked against pyproject; a dispatch from a
          # branch has nothing meaningful to compare.
          expected-version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
