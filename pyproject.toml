[project]
name = "nodered-mcp"
version = "1.1.0"
description = "MCP server for reading, querying, and editing a Node-RED flows.json"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leonardo Merza", email = "ljmerza@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "node-red", "home-assistant", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/ljmerza/nodered-mcp"
Repository = "https://github.com/ljmerza/nodered-mcp"
Issues = "https://github.com/ljmerza/nodered-mcp/issues"

[project.scripts]
nodered-mcp = "nodered_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodered_mcp"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.pytest.ini_options]
testpaths = ["tests"]
