[project]
name = "nodered-mcp"
version = "0.1.0"
description = "MCP server for reading, querying, and editing a Node-RED flows.json"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leonardo Merza", email = "ljmerza@gmail.com" }]
keywords = ["mcp", "node-red", "home-assistant", "automation"]
dependencies = [
    "fastmcp>=2.8,<3",
]

[project.scripts]
nodered-mcp = "nodered_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodered_mcp"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
